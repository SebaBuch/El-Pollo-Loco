<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>El Pollo Loco</title>
</head>

<body onload="init()">

    <h1>El Pollo Loco</h1>

    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="startScreen" class="overlay start-screen">
            <div class="button-row">
                <button class="game-button" onclick="startGame()">Start</button>
                <button class="game-button" onclick="openDialog()">How to play</button>
            </div>
        </div>
        <div id="endScreen" class="overlay end-screen d-none">
            <img id="endScreenImage" class="end-screen-image" src="" alt="End screen">
            <div class="button-row">
                <button class="game-button" onclick="restartGame()">Restart</button>
            </div>
        </div>
    </div>

    <dialog id="howToPlayDialog" onclick="closeDialogOnBackdrop(event)">
        <div class="dialog-content">
            <button class="close-button" onclick="closeDialog()">X</button>
            <h2>How to play</h2>
            <p>Help Pepe cross the desert and defeat the giant chicken.</p>
            <ul>
                <li><b>Arrow left / right:</b> Walk</li>
                <li><b>Space:</b> Jump</li>
                <li><b>D:</b> Throw bottle</li>
            </ul>
            <p>Jump on chickens to defeat them. Collect bottles to fight the boss and grab coins on your way.</p>
        </div>
    </dialog>

    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/small-chicken.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/coin.class.js"></script>
    <script src="js/models/bottle.class.js"></script>
    <script src="js/models/status-bar.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
